<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, 'Spring Payment')}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <!-- NÃO LOGADO (Tela de Login com E-mail e Senha) -->
        <div th:if="${loggedUser == null}" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-4 p-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 50px; height: 50px;">
                            <i class="bi bi-lock-fill fs-4"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Acesso ao Banco</h3>
                    </div>

                    <form action="/web/auth/login" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">E-mail</label>
                            <input type="email" name="email" class="form-control" placeholder="seu.email@dominio.com" required autocomplete="off">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Senha</label>
                            <input type="password" name="password" class="form-control" placeholder="Senha" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">Entrar na conta</button>
                    </form>

                    <hr class="my-3">

                    <div class="text-center">
                        <span class="text-muted small">Ainda não possui cadastro?</span>
                        <a href="/web/customers/new" class="btn btn-outline-primary btn-sm ms-2">Criar conta</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOGADO (Dashboard) -->
        <div th:if="${loggedUser != null}">

            <div class="row mb-4">
                <div class="col-12">
                    <div class="p-4 bg-white rounded-4 shadow-sm border-start border-4 border-primary d-flex justify-content-between align-items-center">
                        <div>
                            <h2 class="fw-bold text-dark mb-1" th:text="${'Olá, ' + loggedUser.name + ' 👋'}">Olá, Usuário</h2>
                            <p class="text-muted mb-0 small">Conta: <code class="text-dark fw-bold" th:text="${loggedUser.accountNumber}">UUID</code> | E-mail: <span th:text="${loggedUser.email}">email@domain.com</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <!-- Saldo em Conta -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="text-muted text-uppercase fw-semibold small">Saldo em Conta</span>
                                <i class="bi bi-wallet2 text-success fs-4"></i>
                            </div>
                            <h3 class="fw-bold text-success mb-0" th:text="${'R$ ' + loggedUser.accountBalance}">R$ 1.000,00</h3>
                        </div>
                    </div>
                </div>

                <!-- Limite de Crédito -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <div class="d-flex align-items-center mb-2">
                                    <span class="text-muted text-uppercase fw-semibold small">Limite de Crédito Disponível</span>
                                    <i class="bi bi-credit-card text-primary fs-4 ms-2"></i>
                                </div>
                                <h3 class="fw-bold text-primary mb-0" th:text="${'R$ ' + loggedUser.creditLimit}">R$ 2.000,00</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100 d-flex flex-column">
                        <h5 class="fw-bold mb-3"><i class="bi bi-arrow-left-right text-primary me-2"></i>Pagamentos</h5>
                        <a href="/web/checkout" class="btn btn-primary fw-semibold mt-auto"><i class="bi bi-send-fill me-2"></i>Novo Pagamento</a>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100 d-flex flex-column">
                        <h5 class="fw-bold mb-3"><i class="bi bi-clock-history text-secondary me-2"></i>Extrato</h5>
                        <a th:href="@{'/web/history/' + ${loggedUser.accountNumber}}" class="btn btn-dark fw-semibold mt-auto"><i class="bi bi-file-text-fill me-2"></i>Ver Extrato</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
