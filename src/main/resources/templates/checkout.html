<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, 'Checkout - Payment Engine')}">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 50px; height: 50px;">
                        <i class="bi bi-arrow-left-right fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Pagamentos</h3>
                </div>

                <form th:action="@{/web/payments}" method="POST">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Chave do Destinatario</label>
                        <input type="text" name="destinationAccountNumber" class="form-control" required autocomplete="off" placeholder="E-mail ou numero da conta">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Valor do pagamento</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required placeholder="0.00" autocomplete="off">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Forma de Pagamento</label>
                        <select name="paymentMethod" class="form-select" required>
                            <option value="" disabled selected>Selecione o método...</option>
                            <option value="PIX">Pix</option>
                            <option value="CREDIT_CARD">Limite de Crédito</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">
                        <i class="bi bi-send-check me-2"></i>Efetuar Transferência
                    </button>
                </form>

                <div class="text-center mt-2">
                    <a href="/" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Voltar para o Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
