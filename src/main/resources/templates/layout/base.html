<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, title)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Spring Payment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>

        .bank-navbar {
            width: 100%;
            padding: 12px 0;
            background: linear-gradient(110deg, #101c36, #172b4d);
            box-shadow: 0 4px 20px rgba(16, 28, 54, 0.12);
        }

        .bank-navbar-inner {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 20px;
        }

        .bank-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-self: start;
            margin: 0;
            min-width: 0;
            color: #fff !important;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f8cff, #2864db);
            color: white;
            font-size: 22px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 750;
            letter-spacing: -0.3px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .brand-subtitle {
            color: #9fb4d8;
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .bank-navigation {
            display: flex;
            justify-self: center;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 4px;
            min-width: 0;
        }

        .bank-nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 12px;
            border-radius: 9px;
            color: #b8c7e4;
            text-decoration: none;
            white-space: nowrap;
            font-size: 0.84rem;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
        }

        .bank-nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .bank-nav-link.active {
            background: #2a4775;
            color: white;
        }

        .bank-nav-link.active i {
            color: #8db7ff;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            justify-self: end;
            gap: 10px;
            min-width: 0;
        }

        .user-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #dce8ff;
            color: #1d4385;
            font-size: 20px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            max-width: 150px;
            color: white;
        }

        .user-greeting {
            color: #aabbd6;
            font-size: 0.7rem;
        }

        .user-info strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.82rem;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 11px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 9px;
            color: white;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-logout:hover {
            background: white;
            color: #142442;
        }

        @media (max-width: 991.98px) {
            .bank-navbar .bank-navbar-inner {
                display: grid !important;
                grid-template-columns: minmax(0, 1fr) auto !important;
                align-items: center;
                gap: 12px 8px;
            }

            .bank-navbar .bank-brand {
                grid-column: 1 !important;
                grid-row: 1 !important;
                min-width: 0;
                margin: 0;
            }

            .bank-navbar .navbar-user {
                grid-column: 2 !important;
                grid-row: 1 !important;
                display: flex;
                justify-self: end;
                align-items: center;
                margin: 0;
                gap: 6px;
            }

            .bank-navbar .bank-navigation {
                grid-column: 1 / -1 !important;
                grid-row: 2 !important;
                display: flex;
                width: 100%;
                justify-self: stretch;
                justify-content: space-between;
                align-items: center;
                flex-wrap: nowrap;
                margin: 0;
                padding-top: 10px;
                border-top: 1px solid rgba(255,255,255,.12);
            }
        }

        @media (max-width: 480px) {
            .bank-navbar .brand-icon {
                width: 34px;
                height: 34px;
                font-size: 18px;
            }

            .bank-navbar .brand-name {
                font-size: 0.82rem;
            }

            .bank-navbar .brand-subtitle {
                font-size: 0.48rem;
            }

            .bank-navbar .user-avatar {
                display: flex;
                width: 30px;
                height: 30px;
                font-size: 16px;
            }

            .bank-navbar .user-greeting {
                display: none;
            }

            .bank-navbar .user-info {
                max-width: 76px;
            }

            .bank-navbar .user-info strong {
                font-size: 0.68rem;
            }

            .bank-navbar .btn-logout {
                width: 34px;
                height: 34px;
                padding: 0;
                justify-content: center;
            }

            .bank-navbar .btn-logout span {
                display: none;
            }

            .bank-navbar .bank-nav-link {
                flex: 1;
                min-width: 0;
                justify-content: center;
                padding: 10px 4px;
                gap: 5px;
                font-size: 0.7rem;
            }
        }


        @media (prefers-reduced-motion: reduce) {
            .bank-nav-link,
            .btn-logout {
                transition: none;
            }
        }
    </style>
</head>
<body class="bg-light">



<nav class="navbar bank-navbar">
    <div class="container bank-navbar-inner">

        <!-- Logo -->
        <a class="navbar-brand bank-brand" href="/">
            <span class="brand-icon">
                <i class="bi bi-bank2"></i>
            </span>

            <span class="brand-text">
                <span class="brand-name">Spring Payment</span>
            </span>
        </a>

        <!-- Navegação -->
        <div th:if="${session.loggedUser != null}"
             class="bank-navigation">

            <a href="/"
               class="bank-nav-link"
               th:classappend="${currentPage == 'dashboard'} ? ' active' : ''">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>

            <a href="/web/checkout"
               class="bank-nav-link"
               th:classappend="${currentPage == 'payments'} ? ' active' : ''">
                <i class="bi bi-arrow-left-right"></i>
                <span>Pagamentos</span>
            </a>

            <a th:href="@{'/web/history/' + ${session.loggedUser.accountNumber}}"
               class="bank-nav-link"
               th:classappend="${currentPage == 'history'} ? ' active' : ''">
                <i class="bi bi-file-earmark-text"></i>
                <span>Extrato</span>
            </a>
        </div>

        <!-- Usuário -->
        <div th:if="${session.loggedUser != null}"
             class="navbar-user">

            <div class="user-avatar">
                <i class="bi bi-person-fill"></i>
            </div>

            <div class="user-info">
                <span class="user-greeting">Bem-vindo(a),</span>
                <strong th:text="${session.loggedUser.name}">Nome</strong>
            </div>

            <a href="/web/auth/logout" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i>
                <span>Sair</span>
            </a>
        </div>

    </div>
</nav>


<main class="container py-5">
    <div th:if="${success}" class="alert alert-success shadow-sm" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger shadow-sm" role="alert" th:text="${error}"></div>
    <div th:replace="${content}"></div>
</main>

</body>
</html>
